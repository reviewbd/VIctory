name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Windows (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            workspace: .
          - variant: nvidia
            workspace: variants/nvidia
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: ${{ matrix.variant == 'nvidia' }}
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Test NVIDIA launcher on Windows PowerShell
        if: matrix.variant == 'nvidia'
        shell: powershell
        run: ./tests/test-play.ps1
      - name: Test NVIDIA launcher on PowerShell 7
        if: matrix.variant == 'nvidia'
        run: ./tests/test-play.ps1
      - name: Build release
        run: cargo build --release --locked -p victory
      - name: Package and check runtime
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "victory-package"
          New-Item -ItemType Directory "$stage/target/release" | Out-Null
          Copy-Item target/release/victory.exe "$stage/target/release/"
          Copy-Item README.md, LICENSE, victory.example.toml $stage
          if ('${{ matrix.variant }}' -eq 'nvidia') {
            New-Item -ItemType Directory "$stage/scripts" | Out-Null
            Copy-Item scripts/play.ps1 "$stage/scripts/"
          }
          & "$stage/target/release/victory.exe" run --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-FileHash "$stage/target/release/victory.exe").Hash |
            Set-Content "$stage/victory.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: victory-${{ matrix.variant }}-windows-x64
          path: ${{ runner.temp }}/victory-package/
          if-no-files-found: error
          retention-days: 14
